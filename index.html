<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test GitHub × Portainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="badge">● EN LIGNE</div>
    <p class="eyebrow">DOCKER • GITHUB • PORTAINER</p>
    <h1>Ça fonctionne 🎉</h1>
    <p class="subtitle">
      Ce site a été envoyé sur GitHub, transformé en image Docker
      puis lancé avec Portainer.
    </p>

    <div class="steps">
      <div><span>1</span><strong>Mac</strong><small>Modification du site</small></div>
      <div><span>2</span><strong>GitHub</strong><small>Stockage + build Docker</small></div>
      <div><span>3</span><strong>Portainer</strong><small>Déploiement sur le NAS</small></div>
    </div>

    <div class="status">
      <span>Heure du navigateur</span>
      <strong id="clock">--:--:--</strong>
    </div>

    <button id="testButton">Tester le JavaScript</button>
    <p id="message"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
